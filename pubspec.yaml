name: domino
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
    
  # App Configuration
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_floating_bottom_bar: ^2.1.0

  # UI + Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  flutter_svg: ^2.3.0
  lottie: ^3.1.2
  pinput: ^6.0.2
  carousel_slider: ^5.1.2
  flutter_rating_bar: ^4.0.1

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1

  # Utilities
  http: ^1.6.0
  logger: ^2.7.0
  url_launcher: ^6.3.2
  intl: ^0.20.3
  connectivity_plus: ^7.3.1


  # Firebase Dependencies
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/

    - assets/icons/
    - assets/icons/auth-icons/
    - assets/icons/categ-icons/
    - assets/icons/home-icons/
    - assets/icons/macro-icons/
    - assets/icons/nav-icons/
    - assets/icons/social-icons/

    - assets/images/
    - assets/images/products/
    - assets/images/auth-images/
    - assets/images/history-images/
    - assets/images/splash/
    - assets/images/banners/


    - assets/splash/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
